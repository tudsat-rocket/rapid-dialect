[package]
name = "rapid-dialect"
version = "0.1.0"
edition = "2021"

[features]
default = []
definitions = ["dep:mavinspect", "dep:postcard", "dep:miniz_oxide", "mavinspect/serde"]

[dependencies]
mavspec = { version = "0.6.7", features = ["rust"] }
mavinspect = { version = "0.6.6", optional = true }
postcard = { version = "1.1.3", optional = true, default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.8.9", optional = true }

[build-dependencies]
mavspec = { version = "0.6.7", features = ["rust_gen"] }
mavinspect = { version = "0.6.6", features = ["serde"] }
heck = "0.5.0"
postcard = { version = "1.1.3", features = ["use-std"] }
miniz_oxide = "0.8.9"
